name: Tend the garden

on:
  schedule:
    # Every 15 minutes, off the top of the hour when GitHub's scheduler is busiest.
    # A run only commits when the public data actually changed.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "garden.json"
      - "fonts/**"
      - "scripts/**"
      - ".github/workflows/garden.yml"

permissions:
  contents: read

concurrency:
  group: garden
  cancel-in-progress: false

jobs:
  tend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install fonttools==4.63.0

      - name: Check the builders
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Draw the section headers
        run: python scripts/build_sections.py

      - name: Draw the bloom log from public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_metrics.py

      - name: Refresh the repository table
        run: python scripts/update_repositories.py

      - name: Commit the refreshed garden
        run: |
          git add README.md assets data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the garden"
          # Files uploaded on github.com while this ran would reject a plain push; replay on top and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1
